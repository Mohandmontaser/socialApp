<header
  class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/85 shadow-sm shadow-slate-900/[0.03] backdrop-blur-xl"
>
  <div
    class="mx-auto flex h-[68px] max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8"
  >
    <!-- Logo -->
    <a routerLink="/timeline" class="group flex shrink-0 items-center gap-2.5">
      <span
        class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-700 shadow-md shadow-blue-600/20 transition group-hover:scale-105"
      >
        <img src="/assets/route.png" alt="Route Posts" class="h-full w-full object-cover" />
      </span>

      <span class="hidden sm:block">
        <span class="block text-base font-extrabold leading-tight tracking-tight text-slate-900">
          Route Posts
        </span>
        <span class="block text-[11px] font-medium text-slate-400">
          Connect with your community
        </span>
      </span>
    </a>

    <!-- Navigation -->
    <nav
      aria-label="Main navigation"
      class="flex items-center gap-1 rounded-2xl border border-slate-200/80 bg-slate-100/80 p-1"
    >
      <a
        routerLink="/timeline"
        routerLinkActive="!bg-white !text-blue-700 shadow-sm"
        
        class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-500 transition duration-200 hover:bg-white/70 hover:text-slate-900 sm:px-4"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="19" height="19"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7"></path>
          <path d="M9 21v-8h6v8"></path>
          <path d="M5 10v11h14V10"></path>
        </svg>
        <span class="hidden sm:inline">Timeline</span>
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="!bg-white !text-blue-700 shadow-sm"
        class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-500 transition duration-200 hover:bg-white/70 hover:text-slate-900 sm:px-4"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="19" height="19"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 21a7 7 0 0 1 14 0"></path>
        </svg>
        <span class="hidden sm:inline">Profile</span>
      </a>

      <a
        routerLink="/notification"
        routerLinkActive="!bg-white !text-blue-700 shadow-sm"
        class="relative flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-500 transition duration-200 hover:bg-white/70 hover:text-slate-900 sm:px-4"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="19" height="19"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
        <span class="hidden sm:inline">Notifications</span>
        <span
          class="absolute right-2 top-1.5 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-slate-100 sm:right-3"
          aria-label="New notifications"
        ></span>
      </a>
    </nav>

    <!-- User dropdown -->
    <div class="relative">
      <button
        id="user-menu-button"
        data-dropdown-toggle="user-menu"
        data-dropdown-placement="bottom-end"
        type="button"
        class="flex items-center gap-2 rounded-full border border-slate-200 bg-white p-1.5 pr-3 transition hover:border-blue-200 hover:bg-blue-50/50 focus:outline-none focus:ring-4 focus:ring-blue-100"
        aria-expanded="false"
        aria-controls="user-menu"
      >
   <img
   [src]="currentUser.user()?.photo || '/assets/default-profile.png'"
   alt="Profile"
   class="h-9 w-9 rounded-full object-cover"
 />

        <span class="hidden text-left sm:block">
          <span class="block max-w-28 truncate text-xs font-bold text-slate-800">
            {{ currentUser.user()?.name }}
          </span>
          <span class="block text-[10px] font-medium text-slate-400">
            View account
          </span>
        </span>

        <svg
          aria-hidden="true"
          class="hidden h-4 w-4 text-slate-400 sm:block"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M5.22 7.47a.75.75 0 0 1 1.06 0L10 11.19l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 8.53a.75.75 0 0 1 0-1.06Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      <div
        id="user-menu"
        class="z-50 hidden w-56 divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-slate-900/10"
      >
        <div class="px-4 py-3">
          <p class="truncate text-sm font-semibold text-slate-900">mohand</p>
          <p class="mt-0.5 text-xs text-slate-500">Manage your account</p>
        </div>

        <ul class="p-2 text-sm text-slate-700" aria-labelledby="user-menu-button">
          <li>
            <a
              routerLink="/profile"
              class="block rounded-xl px-3 py-2.5 transition hover:bg-slate-50 hover:text-blue-700"
            >
              My profile
            </a>
          </li>
          <li>
            <a
              routerLink="/change"
              class="block rounded-xl px-3 py-2.5 transition hover:bg-slate-50 hover:text-blue-700"
            >
              Change password
            </a>
          </li>
          <li>
            <a
              routerLink="/notification"
              class="block rounded-xl px-3 py-2.5 transition hover:bg-slate-50 hover:text-blue-700"
            >
              Notifications
            </a>
          </li>
        </ul>

        <div class="p-2">
          <button
            type="button"
            (click)="logout()"
            class="w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-rose-600 transition hover:bg-rose-50"
          >
            Log out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
