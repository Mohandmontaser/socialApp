
<section class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-950 px-5 py-12">

    <!-- Background Decorations -->
    <div class="pointer-events-none absolute -left-40 -top-40 h-96 w-96 rounded-full bg-blue-600/10 blur-[100px]"></div>
    <div class="pointer-events-none absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-indigo-600/10 blur-[100px]"></div>
  
    <!-- Grid Background -->
    <div
      class="pointer-events-none absolute inset-0 opacity-[0.04]"
      style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 45px 45px;"
    ></div>
  
    <!-- Main Content -->
    <div class="relative z-10 mx-auto w-full max-w-3xl text-center">
  
      <!-- Logo -->
      <div class="mx-auto mb-10 flex h-16 w-16 items-center justify-center rounded-2xl bg-[#00298d] text-3xl font-extrabold text-white shadow-xl shadow-blue-900/30">
        R
      </div>
  
      <!-- 404 Number -->
      <div class="relative mx-auto mb-8">
  
        <h1 class="select-none text-[140px] font-black leading-none tracking-tighter text-transparent sm:text-[200px]"
          style="-webkit-text-stroke: 2px #334155;">
          404
        </h1>
  
        <!-- Center Icon -->
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="flex h-24 w-24 items-center justify-center rounded-3xl border border-blue-400/20 bg-slate-900 shadow-2xl shadow-blue-950/50 sm:h-32 sm:w-32">
  
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="55"
              height="55"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#3b82f6"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 8l8 8"></path>
              <path d="M16 8l-8 8"></path>
            </svg>
  
          </div>
        </div>
  
      </div>
  
      <!-- Error Badge -->
      <div class="mb-6 inline-flex items-center gap-2 rounded-full border border-blue-400/20 bg-blue-500/10 px-4 py-2 text-xs font-bold uppercase tracking-[3px] text-blue-400">
        <span class="h-2 w-2 rounded-full bg-blue-500"></span>
        Error 404
      </div>
  
      <!-- Heading -->
      <h2 class="mb-5 text-3xl font-extrabold tracking-tight text-white sm:text-5xl">
        Lost in the <span class="text-blue-500">Social Space?</span>
      </h2>
  
      <!-- Description -->
      <p class="mx-auto max-w-lg text-sm leading-8 text-slate-400 sm:text-base">
        Looks like this page doesn't exist anymore.
        Maybe the link is broken or the page has been moved.
        Let's get you back on track!
      </p>
  
      <!-- Back Button -->
      <div class="mt-10">
        <button
          type="button"
          (click)="goBack()"
          class="group inline-flex min-w-44 items-center justify-center gap-3 rounded-xl bg-[#00298d] px-9 py-4 text-base font-bold text-white shadow-xl shadow-blue-900/30 transition duration-300 hover:-translate-y-1 hover:bg-blue-700 hover:shadow-blue-900/50 focus:outline-none focus:ring-4 focus:ring-blue-500/30"
        >
  
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="transition-transform duration-300 group-hover:-translate-x-1"
          >
            <path d="m15 18-6-6 6-6"></path>
            <path d="M9 12h12"></path>
          </svg>
  
          Back
  
        </button>
      </div>
  
      <!-- Footer -->
      <div class="mt-20 border-t border-slate-800 pt-7">
        <p class="text-xs font-medium tracking-wide text-slate-500">
          © 2026 Route Posts. All rights reserved.
        </p>
      </div>
  
    </div>
  
  </section>
