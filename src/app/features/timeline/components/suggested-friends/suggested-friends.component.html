<aside class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-user-group text-blue-600"></i>
      <h2 class="text-base font-bold text-slate-900">Suggested Friends</h2>
    </div>
    <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600">
      {{ friends().length }}
    </span>
  </div>

  <div class="grid gap-3">
    @if (isLoading()) {
      @for (item of skeletonItems; track item) {
        <div class="rounded-2xl border border-slate-200 p-3">
          <div class="flex items-start gap-3">
            <div class="h-11 w-11 shrink-0 animate-pulse rounded-full bg-slate-200"></div>
            <div class="min-w-0 flex-1 space-y-2">
              <div class="h-3.5 w-1/2 animate-pulse rounded bg-slate-200"></div>
              <div class="h-3 w-1/3 animate-pulse rounded bg-slate-200"></div>
            </div>
          </div>
        </div>
      }
    } @else {
      @for (friend of friends(); track friend._id) {
        <div class="rounded-2xl border border-slate-200 p-3 transition hover:border-slate-300">
          <div class="flex items-center justify-between gap-2">
            <a [routerLink]="['/profile', friend._id]" class="flex min-w-0 items-center gap-3">
              <img
                [src]="friend.photo"
                [alt]="friend.name"
                class="h-11 w-11 shrink-0 rounded-full border border-slate-100 object-cover"
              />
              <div class="min-w-0">
                <p class="truncate text-sm font-bold text-slate-900">{{ friend.name }}</p>
                <p class="truncate text-xs text-slate-500">&#64;{{ friend.username }}</p>
              </div>
            </a>

            <button
              type="button"
              (click)="follow(friend)"
              [disabled]="followingId() === friend._id"
              class="flex shrink-0 items-center gap-1.5 rounded-xl bg-blue-50 px-3 py-1.5 text-xs font-bold text-blue-600 transition hover:bg-blue-100 disabled:cursor-not-allowed disabled:opacity-60"
            >
              <i class="fa-solid fa-user-plus"></i>
              Follow
            </button>
          </div>

          <div class="mt-2 flex flex-wrap gap-2">
            <span class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-semibold text-slate-500">
              {{ friend.followersCount }} followers
            </span>
          </div>
        </div>
      } @empty {
        <p class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-center text-sm text-slate-500">
          No suggestions found.
        </p>
      }
    }
  </div>

  <a
    routerLink="/suggestions"
    class="mt-3 block w-full rounded-xl border border-slate-200 py-2.5 text-center text-sm font-bold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100"
  >
    View more
  </a>
</aside>
