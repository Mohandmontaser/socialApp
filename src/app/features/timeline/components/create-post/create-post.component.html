<form
  (submit)="submitForm($event, fileInput)"
  class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm mb-3"
>
  <!-- User and privacy -->
  <div class="mb-4 flex items-start gap-3">
    <img
      [src]="currentUser.user()?.photo || '/assets/default-profile.png'"
      alt="Profile"
      class="h-9 w-9 rounded-full object-cover"
    />

    <div class="min-w-0 flex-1">
      <p class="truncate text-base font-extrabold text-slate-900">{{ currentUser.user()?.name }}</p>

      <div class="relative mt-2 inline-block">
        <button
          type="button"
          aria-label="Post privacy"
          (click)="privacyOpen = !privacyOpen"
          class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-xs font-semibold text-slate-700 transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700"
        >
          <i
            class="fa-solid text-[10px]"
            [class.fa-earth-americas]="privacy.value === 'public'"
            [class.fa-user-group]="privacy.value === 'following'"
            [class.fa-lock]="privacy.value === 'only_me'"
          ></i>
          <span>{{ privacyLabel }}</span>
          <i class="fa-solid fa-chevron-down text-[9px]"></i>
        </button>

        <div
          [class.hidden]="!privacyOpen"
          class="absolute left-0 top-full z-20 mt-2 w-56 overflow-hidden rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl"
        >
          <p class="px-3 pb-1 pt-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Post audience</p>

          <button
            (click)="selectPrivacy('public')"
            type="button"
            [class.bg-blue-50]="privacy.value === 'public'"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left transition hover:bg-blue-50"
          >
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-100 text-blue-600">
              <i class="fa-solid fa-earth-americas text-sm"></i>
            </span>
            <span class="flex-1">
              <span class="block text-xs font-bold text-slate-800">Public</span>
              <span class="block text-[10px] text-slate-500">Anyone can see this post</span>
            </span>
          </button>

          <button
            (click)="selectPrivacy('only_me')"
            type="button"
            [class.bg-slate-100]="privacy.value === 'only_me'"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left transition hover:bg-slate-50"
          >
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-600">
              <i class="fa-solid fa-lock text-sm"></i>
            </span>
            <span class="flex-1">
              <span class="block text-xs font-bold text-slate-800">Only me</span>
              <span class="block text-[10px] text-slate-500">Only you can see this post</span>
            </span>
          </button>

          <button
            (click)="selectPrivacy('following')"
            type="button"
            [class.bg-violet-50]="privacy.value === 'following'"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left transition hover:bg-violet-50"
          >
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-violet-100 text-violet-600">
              <i class="fa-solid fa-user-group text-sm"></i>
            </span>
            <span class="flex-1">
              <span class="block text-xs font-bold text-slate-800">Followers</span>
              <span class="block text-[10px] text-slate-500">Shared with your followers</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Post text -->
  <textarea
    #postTextarea
    rows="4"
    [formControl]="content"
    placeholder="What's on your mind, {{ currentUser.user()?.name }}?"
    class="min-h-28 w-full resize-y rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-[15px] leading-6 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-400 focus:bg-white focus:ring-4 focus:ring-blue-100"
  ></textarea>

  <!-- Image preview -->
  @if (fileSrc()) {
    <div class="relative mt-4">
      <div class="absolute right-3 top-3 z-10 flex gap-2">
        <button
          type="button"
          (click)="removeFile(fileInput)"
          title="Remove photo"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-black/60 text-white transition hover:bg-red-600"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <button
          type="button"
          (click)="fileInput.click()"
          class="flex items-center gap-2 rounded-full bg-black/60 px-3 py-2 text-sm font-medium text-white transition hover:bg-black/80"
        >
          <i class="fa-solid fa-pen"></i>
          Change photo
        </button>
      </div>

      <img [src]="fileSrc()" class="h-auto w-full rounded-xl object-contain" alt="" />
    </div>
  }

  <!-- Actions -->
  <div class="mt-4 border-t border-slate-200 pt-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-1">
        <label
          class="flex cursor-pointer items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-emerald-50 hover:text-emerald-700"
        >
          <i class="fa-regular fa-image text-base text-emerald-600"></i>
          <span class="hidden sm:inline">Photo/video</span>
          <input #fileInput (change)="changeFile($event)" type="file" accept="image/*" class="hidden" />
        </label>

        <div class="relative">
          <button
            type="button"
            aria-label="Choose an emoji"
            (click)="emojiOpen = !emojiOpen"
            class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-amber-50 hover:text-amber-700"
          >
            <i class="fa-regular fa-face-smile text-base text-amber-500"></i>
            <span class="hidden sm:inline">Feeling/activity</span>
          </button>

          <div [class.hidden]="!emojiOpen" class="absolute bottom-full left-0 z-20 mb-2">
            <emoji-picker (emoji-click)="onEmojiClick($event, postTextarea)"></emoji-picker>
          </div>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading() || (!content.value?.trim() && !file())"
        class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span>{{ isLoading() ? 'Posting...' : 'Post' }}</span>
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>
  </div>
</form>
