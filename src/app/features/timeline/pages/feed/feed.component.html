@if (isLoading()) {
    @for (item of skeletonPosts; track item) {
      <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm mt-2 mb-5">
        <div class="mb-4 flex items-center gap-3">
          <ngx-skeleton-loader appearance="circle" [theme]="{ width: '44px', height: '44px', margin: '0' }" />
          <div class="flex-1">
            <ngx-skeleton-loader [theme]="{ width: '120px', height: '14px', margin: '0 0 5px' }" />
            <ngx-skeleton-loader [theme]="{ width: '80px', height: '12px', margin: '0' }" />
          </div>
        </div>
  
        <ngx-skeleton-loader [theme]="{ width: '100%', height: '14px', margin: '0 0 8px' }" />
        <ngx-skeleton-loader [theme]="{ width: '75%', height: '14px', margin: '0 0 15px' }" />
        <ngx-skeleton-loader [theme]="{ width: '100%', height: '280px', margin: '0' }" />
      </article>
    }
  } @else {
    @for (post of posts(); track post.id) {
      <app-post-card [post]="post" (deleted)="load()" />
    } @empty {
      <p class="rounded-2xl border border-slate-200 bg-white p-6 text-center text-sm text-slate-500">
        No posts yet. Follow people to see their posts here.
      </p>
    }
  }
