<section class="py-3">
  <div class="mx-auto max-w-3xl min-w-0 px-3">
    <!-- Back -->
    <button
      type="button"
      (click)="goBack()"
      class="mb-3 inline-flex cursor-pointer items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50"
    >
      <i class="fa-solid fa-arrow-left"></i>
      Back
    </button>

    @if (isLoading()) {
      <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="mb-4 flex items-center gap-3">
          <ngx-skeleton-loader appearance="circle" [theme]="{ width: '44px', height: '44px', margin: '0' }" />
          <div class="flex-1">
            <ngx-skeleton-loader [theme]="{ width: '120px', height: '14px', margin: '0 0 5px' }" />
            <ngx-skeleton-loader [theme]="{ width: '80px', height: '12px', margin: '0' }" />
          </div>
        </div>

        <ngx-skeleton-loader [theme]="{ width: '100%', height: '14px', margin: '0 0 8px' }" />
        <ngx-skeleton-loader [theme]="{ width: '75%', height: '14px', margin: '0 0 15px' }" />
        <ngx-skeleton-loader [theme]="{ width: '100%', height: '280px', margin: '0' }" />
      </article>
    } @else if (notFound()) {
      <p class="rounded-2xl border border-slate-200 bg-white p-6 text-center text-sm text-slate-500">
        This post is not available.
      </p>
    } @else if (postData(); as post) {
      <app-post-card [post]="post"  (deleted)="onDeleted()" />
    }
  </div>
</section>
