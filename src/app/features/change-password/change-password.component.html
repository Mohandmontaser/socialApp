<main class="min-w-0 mt-4">
  <div class="mx-auto max-w-2xl">
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
      <div class="mb-5 flex items-center gap-3">
        <span
          class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
            ></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
          </svg>
        </span>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
          <p class="text-sm text-slate-500">Keep your account secure by using a strong password.</p>
        </div>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="submit()" novalidate class="space-y-4">
        <label class="block">
          <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
          <input
            formControlName="password"
            type="password"
            placeholder="Enter current password"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
          />
          @if (
            passwordForm.get('password')?.touched &&
            passwordForm.get('password')?.errors?.['required']
          ) {
            <p class="mt-1 text-xs font-semibold text-rose-600">Current password is required</p>
          }
        </label>

        <label class="block">
          <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
          <input
            formControlName="newPassword"
            type="password"
            placeholder="Enter new password"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
          />
          @if (
            passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid
          ) {
            <p class="mt-1 text-xs font-semibold text-rose-600">
              At least 8 characters with uppercase, lowercase, a number and a symbol
            </p>
          }
        </label>

        <label class="block">
          <span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span>
          <input
            formControlName="confirmNewPassword"
            type="password"
            placeholder="Re-enter new password"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
          />
          @if (
            passwordForm.get('confirmNewPassword')?.touched && passwordForm.errors?.['mismatch']
          ) {
            <p class="mt-1 text-xs font-semibold text-rose-600">Passwords do not match</p>
          }
        </label>

        <button
          type="submit"
          [disabled]="passwordForm.invalid || isLoading"
          class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ isLoading ? 'Updating...' : 'Update password' }}
        </button>
      </form>

      @if (errorMsg) {
        <p class="mt-3 text-sm font-semibold text-rose-600">{{ errorMsg }}</p>
      }
      @if (successMsg) {
        <p class="mt-3 text-sm font-semibold text-emerald-600">{{ successMsg }}</p>
      }
    </section>
  </div>
</main>
