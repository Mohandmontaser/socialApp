
<section class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10 sm:px-6">

    <div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-10">
  

  
      <!-- Icon -->
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 text-[#00298d]">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="m3 7 9 6 9-6"></path>
          <path d="M16 3.5v3"></path>
          <path d="M14.5 5h3"></path>
        </svg>
      </div>
  
      <!-- Title -->
      <h2 class="text-center text-2xl font-extrabold tracking-tight text-slate-900">
        Forgot Password?
      </h2>
  
      <p class="mt-3 text-center text-sm leading-6 text-slate-500">
        No worries! Enter your email address and we'll help you reset your password.
      </p>
  
      <!-- Email Form (Static) -->
      <form class="mt-8 space-y-5">
  
        <!-- Email -->
        <div>
          <label
            for="email"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Email Address
          </label>
  
          <div class="relative">
            <span class="pointer-events-none absolute start-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-10 7L2 7"></path>
              </svg>
            </span>
  
            <input
              id="email"
              type="email"
              placeholder="Enter your email address"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3.5 ps-11 pe-4 text-start text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-[#00298d] focus:bg-white focus:ring-4 focus:ring-[#00298d]/10"
            />
          </div>
        </div>
  
        <!-- Reset Button -->
        <button
          type="button"
          class="w-full rounded-xl bg-[#00298d] py-3.5 text-base font-bold text-white shadow-lg shadow-[#00298d]/20 transition hover:bg-[#001f6b] focus:outline-none focus:ring-4 focus:ring-[#00298d]/20"
        >
          Send Reset Link
        </button>
  
      </form>
  
      <!-- Back To Login -->
      <div class="mt-7 border-t border-slate-100 pt-6 text-center">
        <a
          routerLink="/login"
          class="inline-flex items-center gap-2 text-sm font-bold text-[#00298d] transition hover:underline"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
  
          Back to Login
        </a>
      </div>
  
    </div>
  
  </section>
